<script>
/*-----------------------------------------------------------------------------
  schedule-collapsible.js
  Companion to schedule-collapsible.scss.

  Finds every `## Week NN, MM/DD - MM/DD: Topic` section Quarto rendered, wraps
  it in <details>/<summary>, and leaves the ### subsections (Readings and
  Assignments, Recommended Readings, day-by-day items) inside the collapsed body.

  Include with:  include-after-body: schedule-collapsible.js

  Nothing here touches headings inside callouts — those become callout titles,
  not <section> elements, so they are left exactly as they are.
-----------------------------------------------------------------------------*/

(function () {
  "use strict";

  var CONFIG = {
    // "none" = index view, everything collapsed (default)
    // "all"  = everything expanded
    // "first"= only the first week expanded
    startOpen: "none",

    // Show the Expand all / Collapse all buttons
    toolbar: true,

    // Remember the reader's expanded/collapsed state between visits
    rememberState: true,

    // Matches the output of advdate(): "Week 01, 08/24 - 08/28: Topic"
    pattern: /^\s*Week\s+(\d+)\s*,\s*(\d{1,2}\/\d{1,2})\s*[-–—]\s*(\d{1,2}\/\d{1,2})\s*(?::\s*([\s\S]*))?$/,

    // Badges shown in the week header. `pattern` is tested against the week's
    // callout titles and ### headings only — never body prose — so a sentence
    // like "This exam will cover..." cannot trigger a false positive.
    // Add entries here to flag other weeks (simulation, break, guest lecture).
    flags: [
      {
        name: "exam",
        pattern: /\bexams?\b/i,
        label: "Exam this week",
        icon: "star"
      }
    ]
  };

  var STORAGE_KEY = "quarto-schedule-open-weeks";

  function ready(fn) {
    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", fn);
    } else {
      fn();
    }
  }

  function loadState() {
    if (!CONFIG.rememberState) return null;
    try {
      var raw = window.sessionStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : null;
    } catch (e) {
      return null;
    }
  }

  function saveState() {
    if (!CONFIG.rememberState) return;
    try {
      var open = [];
      document.querySelectorAll("section.week-section > details[open]").forEach(function (d) {
        if (d.parentElement.id) open.push(d.parentElement.id);
      });
      window.sessionStorage.setItem(STORAGE_KEY, JSON.stringify(open));
    } catch (e) {
      /* private browsing, quota, etc. — degrade silently */
    }
  }

  var ICONS = {
    star: '<svg viewBox="0 0 24 24" width="1em" height="1em" fill="currentColor" ' +
          'aria-hidden="true" focusable="false"><path d="M12 17.75l-6.172 3.245' +
          'l1.179-6.873l-5-4.867l6.9-1L12 1.999l3.086 6.253l6.9 1l-5 4.867' +
          'l1.179 6.873z"/></svg>'
  };

  /* Which flags apply to this week?
     Only callout titles and subsection headings are scanned, so the exam
     callout's title ("Friday 09/25: Exam 1: Historical Background") triggers
     the badge while its body text ("This exam will cover...") does not. */
  function detectFlags(body) {
    var labels = [];
    body
      .querySelectorAll(
        ".callout-title-container, .callout-caption, .callout-title, h3, h4, h5, h6"
      )
      .forEach(function (el) {
        labels.push(el.textContent);
      });

    var haystack = labels.join(" \n ");
    return CONFIG.flags.filter(function (flag) {
      return flag.pattern.test(haystack);
    });
  }

  function flagElement(flag) {
    var span = document.createElement("span");
    span.className = "week-flag week-flag--" + flag.name;
    span.setAttribute("title", flag.label);
    span.setAttribute("role", "img");
    span.setAttribute("aria-label", flag.label);
    span.innerHTML = ICONS[flag.icon] || ICONS.star;
    return span;
  }

  /* Rebuild the <h2> as chip + title + flags + dates, preserving any element
     children Quarto may have already injected (anchor links, spans, math). */
  function decorateHeading(h2, match, flags) {
    var extras = [];
    Array.prototype.forEach.call(h2.children, function (child) {
      extras.push(child);
    });

    var weekNo = match[1];
    var start = match[2];
    var end = match[3];
    var title = (match[4] || "").trim();

    h2.textContent = "";

    var chip = document.createElement("span");
    chip.className = "week-number";
    chip.textContent = "Week " + weekNo;
    h2.appendChild(chip);

    var titleEl = document.createElement("span");
    titleEl.className = "week-title";
    titleEl.textContent = title || "Course schedule";
    h2.appendChild(titleEl);

    (flags || []).forEach(function (flag) {
      titleEl.appendChild(document.createTextNode(" "));
      titleEl.appendChild(flagElement(flag));
    });

    var dates = document.createElement("span");
    dates.className = "week-dates";
    dates.textContent = start + " – " + end;
    h2.appendChild(dates);

    extras.forEach(function (child) {
      h2.appendChild(child);
    });

    return { weekNo: weekNo, title: title };
  }

  function subsectionCount(section) {
    return section.querySelectorAll(":scope > section.level3, :scope > .callout").length;
  }

  function collapse(section, index, restored) {
    var h2 = section.querySelector(":scope > h2");
    if (!h2) return false;

    var match = CONFIG.pattern.exec(h2.textContent);
    if (!match) return false;               // not a week block — leave it alone

    var count = subsectionCount(section);

    var details = document.createElement("details");
    var summary = document.createElement("summary");
    summary.className = "week-summary";

    var body = document.createElement("div");
    body.className = "week-body";

    // Move everything after the h2 into the body, in order.
    var node = h2.nextSibling;
    while (node) {
      var next = node.nextSibling;
      body.appendChild(node);
      node = next;
    }

    decorateHeading(h2, match, detectFlags(body));

    if (count > 0) {
      var badge = document.createElement("span");
      badge.className = "week-count";
      badge.textContent = count + (count === 1 ? " section" : " sections");
      h2.appendChild(badge);
    }

    summary.appendChild(h2);
    details.appendChild(summary);
    details.appendChild(body);

    var shouldOpen;
    if (restored) {
      shouldOpen = restored.indexOf(section.id) !== -1;
    } else if (CONFIG.startOpen === "all") {
      shouldOpen = true;
    } else if (CONFIG.startOpen === "first") {
      shouldOpen = index === 0;
    } else {
      shouldOpen = false;
    }
    if (shouldOpen) details.setAttribute("open", "");

    section.classList.add("week-section");
    section.appendChild(details);
    details.addEventListener("toggle", saveState);

    return true;
  }

  function buildToolbar(firstSection) {
    if (!CONFIG.toolbar || !firstSection) return;

    var bar = document.createElement("div");
    bar.className = "week-toolbar";
    bar.setAttribute("role", "group");
    bar.setAttribute("aria-label", "Course schedule controls");

    function button(label, open) {
      var b = document.createElement("button");
      b.type = "button";
      b.className = "week-toolbar__btn";
      b.textContent = label;
      b.addEventListener("click", function () {
        document.querySelectorAll("section.week-section > details").forEach(function (d) {
          if (open) {
            d.setAttribute("open", "");
          } else {
            d.removeAttribute("open");
          }
        });
        saveState();
      });
      return b;
    }

    bar.appendChild(button("Expand all", true));
    bar.appendChild(button("Collapse all", false));

    var hint = document.createElement("span");
    hint.className = "week-toolbar__hint";
    hint.textContent = "Select a week to see readings and assignments";
    bar.appendChild(hint);

    firstSection.parentNode.insertBefore(bar, firstSection);
  }

  /* Open any collapsed week that contains the element a link points at, so
     TOC links and shared #anchors always land somewhere visible. */
  function revealTarget(hash) {
    if (!hash || hash.length < 2) return;
    var target;
    try {
      target = document.querySelector(hash);
    } catch (e) {
      return;
    }
    if (!target) return;

    var opened = false;
    var el = target;
    while (el) {
      if (el.tagName === "DETAILS" && !el.hasAttribute("open")) {
        el.setAttribute("open", "");
        opened = true;
      }
      el = el.parentElement;
    }
    if (opened) {
      saveState();
      var scroll = function () {
        if (typeof target.scrollIntoView === "function") {
          target.scrollIntoView({ block: "start" });
        }
      };
      if (typeof window.requestAnimationFrame === "function") {
        window.requestAnimationFrame(scroll);
      } else {
        window.setTimeout(scroll, 0);
      }
    }
  }

  ready(function () {
    var sections = Array.prototype.slice.call(
      document.querySelectorAll("section.level2")
    );

    var restored = loadState();
    var made = [];

    sections.forEach(function (section, i) {
      if (collapse(section, made.length, restored)) made.push(section);
    });

    if (!made.length) return;

    buildToolbar(made[0]);
    revealTarget(window.location.hash);

    window.addEventListener("hashchange", function () {
      revealTarget(window.location.hash);
    });

    // Backup for same-page TOC clicks that do not change the hash.
    document.addEventListener("click", function (evt) {
      var link = evt.target.closest && evt.target.closest('a[href^="#"]');
      if (link) revealTarget(link.getAttribute("href"));
    });

    // Printing expands everything, then restores what the reader had open.
    var printState = [];
    window.addEventListener("beforeprint", function () {
      printState = [];
      document.querySelectorAll("section.week-section > details").forEach(function (d) {
        printState.push(d.hasAttribute("open"));
        d.setAttribute("open", "");
      });
    });
    window.addEventListener("afterprint", function () {
      document.querySelectorAll("section.week-section > details").forEach(function (d, i) {
        if (!printState[i]) d.removeAttribute("open");
      });
    });
  });
})();
</script>
